name: APA SEO Audit (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current SEO audit and group baseline failures
        run: |
          python scripts/audit-seo.py | tee audit-seo-before.txt
          python - <<'PY'
          from collections import Counter
          from pathlib import PurePosixPath
          import re
          lines = [line.strip() for line in open("audit-seo-before.txt", encoding="utf-8") if line.strip()]
          failures = [line for line in lines if ": " in line and not line.startswith("Failures:")]
          by_type = Counter()
          by_folder = Counter()
          for line in failures:
              path, kind = line.rsplit(": ", 1)
              parts = PurePosixPath(path).parts
              folder = parts[0] if len(parts) > 1 else "root pages"
              if folder not in {"blog", "pages", "worksheets", "free"}:
                  folder = "root pages"
              by_type[kind] += 1
              by_folder[folder] += 1
          print(f"BASELINE_FAILURES={len(failures)}")
          print("BASELINE_BY_TYPE")
          for key, value in by_type.most_common():
              print(f"{key}: {value}")
          print("BASELINE_BY_FOLDER")
          for key, value in sorted(by_folder.items()):
              print(f"{key}: {value}")
          PY
      - name: Upload baseline report
        uses: actions/upload-artifact@v4
        with:
          name: apa-seo-audit-before
          path: audit-seo-before.txt
          retention-days: 14
