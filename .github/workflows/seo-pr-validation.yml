name: APA SEO PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.html'
      - 'pages/**'
      - 'blog/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile scripts/audit-seo.py scripts/generate-sitemap.py scripts/generate-worksheet-index.py scripts/generate-year-pages.py scripts/generate-worksheet-pages.py scripts/update-worksheet-language.py scripts/validate-sitemap-transition.py scripts/add-related-worksheet-links.py scripts/update-navigation-links.py

      - name: Run read-only SEO audit
        run: python scripts/audit-seo.py

      - name: Validate crawler access policy
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("robots.txt").read_text(encoding="utf-8")
          groups = {}
          current = None
          for raw in text.splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              key, _, value = line.partition(":")
              key, value = key.strip().lower(), value.strip()
              if key == "user-agent":
                  current = value
                  groups.setdefault(current, [])
              elif current and key in {"allow", "disallow"}:
                  groups[current].append((key, value))

          assert ("allow", "/") in groups.get("OAI-SearchBot", []), "OAI-SearchBot must be allowed"
          assert ("disallow", "/*.pdf$") in groups.get("OAI-SearchBot", []), "OAI-SearchBot must not crawl PDF files"
          assert ("disallow", "/") in groups.get("GPTBot", []), "GPTBot must remain blocked"
          assert ("disallow", "/") in groups.get("ChatGPT-User", []), "ChatGPT-User preference block unexpectedly changed"
          assert any(line.lower().startswith("sitemap:") for line in text.splitlines()), "Sitemap directive missing"
          print("Crawler access policy checks passed.")
          PY

      - name: Validate sitemap XML and URL uniqueness
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text]
          duplicates = sorted({url for url in urls if urls.count(url) > 1})

          print(f"Sitemap URLs: {len(urls)}")
          print(f"Duplicate URLs: {len(duplicates)}")
          if not urls:
              raise SystemExit("ERROR: sitemap contains no URLs")
          if duplicates:
              print("\n".join(duplicates[:30]))
              raise SystemExit("ERROR: duplicate sitemap URLs found")
          PY
