name: Generate Worksheet Previews

# Automatic PDF -> PNG preview chain only. Indexable HTML pages are curated separately.

on:
  push:
    branches:
      - main
    paths:
      - 'worksheets/**'
      - '!worksheets/**/previews/**'
      - 'scripts/generate-worksheet-pages.py'
      - 'scripts/worksheet_page_paths.py'
      - 'scripts/test_worksheet_page_paths.py'
      - '.github/workflows/generate-worksheet-pages.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: "Comma-separated worksheet folders to process"
        required: true
        default: "worksheets"

permissions:
  contents: write

concurrency:
  group: apa-content-generators
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview tools
        run: pip install pymupdf pillow

      - name: Validate generator
        run: python -m py_compile scripts/generate-worksheet-pages.py scripts/worksheet_page_paths.py

      - name: Test worksheet page-path collision handling
        run: python -m unittest discover -s scripts -p 'test_worksheet_page_paths.py'

      - name: Generate missing PNG previews
        env:
          PREVIEW_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'worksheets' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import fitz

          made = 0
          failed = 0
          scopes = [x.strip().rstrip('/') for x in os.environ['PREVIEW_SCOPE'].split(',') if x.strip()]
          seen = set()

          for scope in scopes:
              root = Path(scope)
              if not root.exists():
                  continue
              candidates = []
              for item in root.rglob('*'):
                  if not item.is_file():
                      continue
                  if item.suffix.lower() == '.pdf':
                      candidates.append(item)
                  elif not item.suffix:
                      try:
                          with item.open('rb') as stream:
                              if stream.read(5) == b'%PDF-':
                                  candidates.append(item)
                      except OSError:
                          pass
              for pdf in sorted(candidates):
                  if pdf in seen:
                      continue
                  seen.add(pdf)
                  if 'answer-key' in pdf.name.lower() or 'answerkey' in pdf.name.lower():
                      continue
                  out = pdf.parent / 'previews' / f'{pdf.stem.strip()}.png'
                  if out.exists() and out.stat().st_size > 0:
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      with fitz.open(pdf) as doc:
                          if not doc.page_count:
                              raise RuntimeError('empty PDF')
                          pix = doc[0].get_pixmap(dpi=160, alpha=False)
                          pix.save(out)
                      made += 1
                      print(f'Made: {out}')
                  except Exception as exc:
                      failed += 1
                      print(f'FAILED: {pdf}: {exc}')

          print(f'Preview summary: made={made} failed={failed}')
          if failed:
              raise SystemExit(f'{failed} preview(s) failed')
          PY

      - name: Confirm curated page publishing policy
        run: |
          echo "Generic filename-based HTML page generation is disabled."
          echo "PDF preview generation remains enabled."
          echo "New indexable pages must be curated and reviewed before commit."

      - name: Validate generated pages and previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          failures = []
          changed = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          files = [line[3:] for line in changed.splitlines() if len(line) > 3]

          for raw in files:
              path = Path(raw)
              if path.suffix.lower() == '.html' and str(path).startswith('pages/'):
                  text = path.read_text(encoding='utf-8')
                  checks = {
                      'html': '</html>' in text,
                      'canonical': '<link rel="canonical"' in text,
                      'h1': '<h1>' in text,
                      'pdf_link': 'Download Free PDF' in text and 'worksheets/' in text,
                      'preview': '<img ' in text and 'preview' in text,
                      'who_for': 'Who is it for?' in text,
                      'practice': 'What students practise' in text,
                      'quick_answers': 'Quick answers' in text,
                      'skill_focus': 'Skill focus' in text,
                      'next_step': 'What next?' in text and 'Next step:' in text,
                      'no_placeholder': not any(x in text for x in ('SEE_FILE', 'PLACEHOLDER_CONTENT', 'TODO_RESTORE')),
                  }
                  bad = [name for name, ok in checks.items() if not ok]
                  if bad:
                      failures.append(f'{path}: {", ".join(bad)}')
              elif path.suffix.lower() == '.png' and '/previews/' in str(path):
                  if not path.exists() or path.stat().st_size == 0:
                      failures.append(f'{path}: empty preview')

          if failures:
              raise SystemExit('Generated asset validation failed:\n' + '\n'.join(failures))
          print('Generated asset validation passed.')
          PY

      - name: Commit generated previews
        run: |
          if [ -z "$(git status --porcelain -- worksheets)" ]; then
            echo "No new worksheet previews were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheets/
          if git diff --cached --quiet; then
            echo "No staged worksheet asset changes."
            exit 0
          fi
          git commit -m "Auto-generate worksheet previews"
          git pull --rebase origin main
          git push origin HEAD:main
