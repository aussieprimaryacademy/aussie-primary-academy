name: Generate Individual Worksheet Pages

# Generate missing individual HTML pages after worksheet preview PNGs are ready.
# Manual dispatch remains available for a controlled scope/test.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Comma-separated worksheet folders to process"
        required: true
        default: "worksheets"
      max_new_pages:
        description: "Maximum new HTML pages to create"
        required: true
        default: "500"
  workflow_run:
    workflows:
      - "Make Worksheet PNG Previews"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: worksheet-page-generator
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generator
        run: python -m py_compile scripts/generate-worksheet-pages.py

      - name: Generate missing worksheet pages
        env:
          PAGE_GENERATOR_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'worksheets' }}
          MAX_NEW_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_new_pages || '500' }}
        run: python scripts/generate-worksheet-pages.py

      - name: Validate generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          failures = []
          changed = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          generated = [
              Path(line[3:])
              for line in changed.splitlines()
              if (line.startswith('?? pages/') or line.startswith(' M pages/') or line.startswith('A  pages/'))
          ]

          for page in generated:
              text = page.read_text(encoding='utf-8')
              checks = {
                  'html': '</html>' in text,
                  'canonical': '<link rel="canonical"' in text,
                  'h1': '<h1>' in text,
                  'pdf_link': 'Download Free PDF' in text and '.pdf' in text,
                  'preview': '<img ' in text and 'preview' in text,
                  'no_placeholder': not any(x in text for x in ('SEE_FILE', 'PLACEHOLDER_CONTENT', 'TODO_RESTORE')),
              }
              bad = [name for name, ok in checks.items() if not ok]
              if bad:
                  failures.append(f'{page}: {", ".join(bad)}')

          if failures:
              raise SystemExit('Generated page validation failed:\n' + '\n'.join(failures))
          print(f'Generated page validation passed for {len(generated)} new/changed page(s).')
          PY

      - name: Commit generated pages
        run: |
          if [ -z "$(git status --porcelain -- pages/)" ]; then
            echo "No new worksheet pages were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/
          if git diff --cached --quiet; then
            echo "No staged worksheet page changes."
            exit 0
          fi
          git commit -m "Auto-generate missing worksheet pages"
          git pull --rebase origin main
          git push origin HEAD:main
