name: APA Live HTML and PDF HTTP Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-live-http.py'
      - '.github/workflows/live-http-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-live-http.py'
      - '.github/workflows/live-http-audit.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apa-live-http-audit
  cancel-in-progress: false

jobs:
  live-http-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check audit script syntax
        run: python -m py_compile scripts/audit-live-http.py

      - name: Check live HTML and PDF URLs
        run: python scripts/audit-live-http.py

      - name: Upload URL-by-URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apa-live-http-audit
          path: |
            live-http-audit.json
            live-http-audit.csv
          if-no-files-found: warn
          retention-days: 30
