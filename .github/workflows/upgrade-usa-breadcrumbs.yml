name: Upgrade USA worksheet breadcrumbs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update USA breadcrumb hierarchy
        shell: python
        run: |
          from pathlib import Path
          grades = {'1':'usa-grade-1.html','5':'usa-grade-5.html','6':'usa-grade-6.html'}
          changed=[]
          for grade, hub in grades.items():
              p=Path(hub); s=p.read_text(encoding='utf-8')
              old=f'<li><a href="worksheets.html">Worksheets</a></li><li aria-current="page">USA Grade {grade}</li>'
              new=f'<li><a href="worksheets.html">Worksheets</a></li><li><a href="usa-worksheets.html">USA Worksheets</a></li><li aria-current="page">USA Grade {grade}</li>'
              if old in s:
                  s=s.replace(old,new,1); changed.append(hub)
              old_json=f'{{"@type":"ListItem","position":2,"name":"Worksheets","item":"https://aussieprimaryacademy.github.io/aussie-primary-academy/worksheets.html"}},\n          {{"@type":"ListItem","position":3,"name":"USA Grade {grade} Worksheets"}}'
              new_json=f'{{"@type":"ListItem","position":2,"name":"Worksheets","item":"https://aussieprimaryacademy.github.io/aussie-primary-academy/worksheets.html"}},\n          {{"@type":"ListItem","position":3,"name":"USA Worksheets","item":"https://aussieprimaryacademy.github.io/aussie-primary-academy/usa-worksheets.html"}},\n          {{"@type":"ListItem","position":4,"name":"USA Grade {grade} Worksheets"}}'
              if old_json in s: s=s.replace(old_json,new_json,1)
              p.write_text(s,encoding='utf-8')
          expected=20
          individual=[p for grade in grades for p in Path('pages').glob(f'free-printable-grade-{grade}-*.html')]
          if len(individual)!=expected: raise SystemExit(f'Expected {expected} USA Grade 1/5/6 pages, found {len(individual)}')
          for grade in grades:
              for p in Path('pages').glob(f'free-printable-grade-{grade}-*.html'):
                  s=p.read_text(encoding='utf-8')
                  old=f'<li><a href="../worksheets.html">Worksheets</a></li>\n<li><a href="../usa-grade-{grade}.html">USA Worksheets</a></li>\n'
                  new=f'<li><a href="../worksheets.html">Worksheets</a></li>\n<li><a href="../usa-worksheets.html">USA Worksheets</a></li>\n<li><a href="../usa-grade-{grade}.html">Grade {grade}</a></li>\n'
                  if old in s:
                      s=s.replace(old,new,1); p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('Updated files:',len(changed)); print('\n'.join(changed))
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usa-grade-1.html usa-grade-5.html usa-grade-6.html pages .github/workflows/upgrade-usa-breadcrumbs.yml
          git commit -m "feat: improve USA worksheet breadcrumb hierarchy"
          git rm .github/workflows/upgrade-usa-breadcrumbs.yml
          git commit -m "chore: remove temporary USA breadcrumb workflow"
          git push
