name: Temporary APA worksheet locale batch

on:
  push:
    branches:
      - seo/technical-cleanup-nov-2026
    paths:
      - .github/workflows/temp-worksheet-locale-batch.yml

permissions:
  contents: write

jobs:
  update-worksheet-locale:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the SEO review branch
        uses: actions/checkout@v4
        with:
          ref: seo/technical-cleanup-nov-2026
          fetch-depth: 0

      - name: Update only worksheet HTML language attributes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          already_correct = []
          other_locales = []
          missing_lang = []

          for path in sorted(Path("pages").rglob("*.html")):
              original = path.read_text(encoding="utf-8")
              match = re.search(r'<html\\b[^>]*\\blang=(["\\'])([^"\\']+)\\1', original, re.I)
              if not match:
                  missing_lang.append(str(path))
                  continue

              current = match.group(1)
              parts = {part.lower() for part in path.parts}
              name = path.name.lower()
              is_usa = "usa" in parts or name.startswith(("us-", "usa-"))
              expected = "en-US" if is_usa else "en-AU"

              if current == expected:
                  already_correct.append(str(path))
              elif current.lower() == "en":
                  updated = original[:match.start(1)] + expected + original[match.end(1):]
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
              else:
                  other_locales.append(f"{path}: {current} (left unchanged)")

          print(f"Updated: {len(changed)}")
          print(f"Already correct: {len(already_correct)}")
          print(f"Missing lang: {len(missing_lang)}")
          print(f"Other locales left unchanged: {len(other_locales)}")

          if len(changed) != 466:
              raise SystemExit(
                  f"STOP: expected exactly 466 worksheet locale changes from the reviewed patch; found {len(changed)}. Nothing will be committed."
              )
          if missing_lang or other_locales:
              raise SystemExit("STOP: unexpected worksheet language markup requires manual review.")
          PY

      - name: Commit the batch to the SEO review branch
        shell: bash
        run: |
          rm .github/workflows/temp-worksheet-locale-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- pages .github/workflows/temp-worksheet-locale-batch.yml
          git commit -m 'seo: set correct English locale on 466 worksheet pages'
          git push origin HEAD:seo/technical-cleanup-nov-2026
