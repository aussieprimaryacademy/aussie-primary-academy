name: APA PDF Content and Answer Structure Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-pdf-content.py'
      - '.github/workflows/pdf-content-audit.yml'
      - 'worksheets/**/*.pdf'
      - 'pages/**/*.pdf'
      - 'free/**/*.pdf'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-pdf-content.py'
      - '.github/workflows/pdf-content-audit.yml'
      - 'worksheets/**/*.pdf'
      - 'pages/**/*.pdf'
      - 'free/**/*.pdf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apa-pdf-content-audit
  cancel-in-progress: false

jobs:
  pdf-content-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF text extraction library
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"

      - name: Check audit script syntax
        run: python -m py_compile scripts/audit-pdf-content.py

      - name: Audit PDF integrity, extracted text and answer structure
        run: python scripts/audit-pdf-content.py

      - name: Upload PDF content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apa-pdf-content-audit
          path: |
            pdf-content-audit.json
            pdf-content-audit.csv
            pdf-text-extracts.jsonl
            pdf-review-pages/**
          if-no-files-found: warn
          retention-days: 30
