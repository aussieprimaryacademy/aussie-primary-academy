name: Generate Sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - 'pages/**'
      - 'blog/**'
      - 'scripts/generate-sitemap.py'
      - '.github/workflows/generate-sitemap.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sitemap
        run: |
          python scripts/generate-sitemap.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet sitemap.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No sitemap changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Sitemap changed"
            wc -l sitemap.xml
            grep -c '<loc>' sitemap.xml
          fi

      - name: Commit and push sitemap
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "fix: auto-generate complete sitemap from repository inventory"
          git push
