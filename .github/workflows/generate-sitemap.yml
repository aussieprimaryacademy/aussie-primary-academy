name: Generate Sitemap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'pages/**'
      - 'blog/**'
      - 'worksheets/**/*.pdf'
      - 'scripts/generate-sitemap.py'
      - 'scripts/generate-worksheet-index.py'
      - '.github/workflows/generate-sitemap.yml'

permissions:
  contents: write

concurrency:
  group: generate-sitemap-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generators
        run: python -m py_compile scripts/generate-sitemap.py scripts/generate-worksheet-index.py

      - name: Generate worksheet index
        run: python scripts/generate-worksheet-index.py

      - name: Generate sitemap
        run: python scripts/generate-sitemap.py

      - name: Validate sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sitemap = Path('sitemap.xml')
          ET.parse(sitemap)
          text = sitemap.read_text(encoding='utf-8')
          count = text.count('<loc>')
          if count == 0:
              raise SystemExit('ERROR: sitemap contains no URLs')
          print(f'Sitemap XML is valid: {count} URLs')
          PY

      - name: Commit and push generated files
        run: |
          if git diff --quiet -- sitemap.xml worksheets.html; then
            echo 'No generated changes'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml worksheets.html
          git commit -m 'chore: auto-update sitemap and worksheet index'

          # Another content workflow can finish while this job is running.
          # Rebase before pushing so the sitemap job does not fail on a
          # non-fast-forward update.
          git pull --rebase origin main
          git push origin HEAD:main
