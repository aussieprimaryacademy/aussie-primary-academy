name: Generate Sitemap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'pages/**'
      - 'blog/**'
      - 'worksheets/**/*.pdf'
      - 'scripts/generate-sitemap.py'
      - 'scripts/generate-worksheet-index.py'
      - 'scripts/generate-year-pages.py'
      - 'scripts/update-worksheet-language.py'
      - 'scripts/ensure-site-analytics.py'
      - '.github/workflows/generate-sitemap.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Share the queue with worksheet preview/page generation so two
  # GitHub Actions writers never push at the same time.
  group: apa-content-generators
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generators
        run: python -m py_compile scripts/generate-sitemap.py scripts/generate-worksheet-index.py scripts/generate-year-pages.py scripts/update-worksheet-language.py

      - name: Snapshot current sitemap URLs before generation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text]
          Path("/tmp/apa-previous-sitemap-urls.txt").write_text("\n".join(urls), encoding="utf-8")
          print(f"Previous sitemap URL count: {len(urls)}")
          PY

      - name: Set worksheet page language by resource region
        run: python scripts/update-worksheet-language.py

      - name: Generate worksheet index
        run: python scripts/generate-worksheet-index.py

      - name: Generate year pages
        run: python scripts/generate-year-pages.py

      - name: Ensure site analytics and PDF click tracking
        run: python scripts/ensure-site-analytics.py

      - name: Generate sitemap
        run: python scripts/generate-sitemap.py

      - name: Validate sitemap
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sitemap = Path('sitemap.xml')
          ET.parse(sitemap)
          text = sitemap.read_text(encoding='utf-8')
          count = text.count('<loc>')
          if count == 0:
              raise SystemExit('ERROR: sitemap contains no URLs')
          print(f'Sitemap XML is valid: {count} URLs')
          from pathlib import Path
          from urllib.parse import unquote
          import importlib.util

          spec = importlib.util.spec_from_file_location("sitemap_generator", "scripts/generate-sitemap.py")
          generator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(generator)
          previous = set(Path("/tmp/apa-previous-sitemap-urls.txt").read_text(encoding="utf-8").splitlines())
          current = {node.text.strip() for node in ET.parse(sitemap).getroot().findall(".//{http://www.sitemaps.org/schemas/sitemap/0.9}loc") if node.text}
          removed = sorted(previous - current)
          unexpected = []
          for url in removed:
              if not url.startswith(generator.BASE):
                  unexpected.append(url + " (outside canonical site)")
                  continue
              relative = unquote(url[len(generator.BASE):]) or "index.html"
              page = generator.ROOT / relative
              if not page.is_file():
                  unexpected.append(url + " (source file missing; manual review required)")
                  continue
              if not (generator.is_excluded_path(page) or generator.parse_page(page)[0]):
                  unexpected.append(url + " (not covered by an explicit exclusion rule)")
          print(f"Previous URLs: {len(previous)}; generated URLs: {len(current)}")
          print(f"Removed URLs: {len(removed)}; expected hard-exclusion removals: {len(removed) - len(unexpected)}")
          if removed:
              print("Reviewed removals:\n" + "\n".join(removed))
          if unexpected:
              raise SystemExit("ERROR: unexpected sitemap removals require manual review:\n" + "\n".join(unexpected))
          print("Sitemap URL comparison passed: no unexplained removals.")
          PY

      - name: Open a pull request with generated files (never pushes to main)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/sitemap-update
          add-paths: |
            *.html
            pages/*.html
            blog/*.html
            pages/**/*.html
            blog/**/*.html
            sitemap.xml
          commit-message: 'chore: auto-update sitemap and worksheet index'
          title: 'chore: auto-update sitemap and worksheet index'
          body: 'Generated automatically. Review sitemap URL additions/removals and lastmod dates before merging.'
          delete-branch: true
