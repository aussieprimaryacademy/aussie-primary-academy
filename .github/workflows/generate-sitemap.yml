name: Generate Sitemap

# Automatic runs are disabled. Run manually from the Actions tab when required.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Share the queue with worksheet preview generation so two
  # GitHub Actions writers never push at the same time.
  group: apa-content-generators
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generators
        run: python -m py_compile scripts/generate-sitemap.py scripts/generate-worksheet-index.py scripts/generate-year-pages.py scripts/update-worksheet-language.py scripts/validate-sitemap-transition.py scripts/update-navigation-links.py scripts/add-related-worksheet-links.py scripts/worksheet_page_paths.py

      - name: Test related worksheet subject and year-level classification
        run: python -m unittest discover -s scripts -p 'test_add_related_worksheet_links.py'

      - name: Test worksheet page-path collision handling
        run: python -m unittest discover -s scripts -p 'test_worksheet_page_paths.py'

      - name: Snapshot current sitemap URLs before generation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text]
          Path("/tmp/apa-previous-sitemap-urls.txt").write_text("\n".join(urls), encoding="utf-8")
          print(f"Previous sitemap URL count: {len(urls)}")
          PY

      - name: Set worksheet page language by resource region
        run: python scripts/update-worksheet-language.py

      - name: Update navigation links to dedicated hubs
        run: python scripts/update-navigation-links.py

      - name: Add related worksheet modules to generated pages
        run: python scripts/add-related-worksheet-links.py

      - name: Generate worksheet index
        run: python scripts/generate-worksheet-index.py

      - name: Generate year pages
        run: python scripts/generate-year-pages.py

      - name: Ensure site analytics and PDF click tracking
        run: python scripts/ensure-site-analytics.py

      - name: Generate sitemap
        run: python scripts/generate-sitemap.py

      - name: Test curated End-of-Year pages, cards and sitemap
        run: python -m unittest discover -s scripts -p 'test_end_of_year_pages.py'

      - name: Validate sitemap and review every removed URL
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sitemap = Path("sitemap.xml")
          root = ET.parse(sitemap).getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall(".//sm:loc", ns) if node.text]
          if not urls:
              raise SystemExit("ERROR: sitemap contains no URLs")
          if len(urls) != len(set(urls)):
              raise SystemExit("ERROR: sitemap contains duplicate URLs")
          print(f"Sitemap XML is valid: {len(urls)} unique URLs")
          PY
          python scripts/validate-sitemap-transition.py /tmp/apa-previous-sitemap-urls.txt

      - name: Remove Python cache files before staging generated changes
        run: rm -rf scripts/__pycache__

      - name: Open a pull request with generated files (never pushes to main)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/sitemap-update
          commit-message: 'chore: auto-update sitemap and worksheet index'
          title: 'chore: auto-update sitemap and worksheet index'
          body: 'Generated manually. Review sitemap URL additions/removals and lastmod dates before merging.'
          delete-branch: true
