name: Generate Worksheet Index

# Worksheet index generation is now owned by Generate Sitemap.
# Keep this workflow as a manual emergency fallback only so two workflows
# cannot race to write worksheets.html at the same time.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generator
        run: python -m py_compile scripts/generate-worksheet-index.py

      - name: Generate worksheet catalogue
        run: python scripts/generate-worksheet-index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet worksheets.html; then
            echo "No changes to worksheets.html"
          else
            git add worksheets.html
            git commit -m "Manual regenerate worksheets.html catalogue ($(python -c 'from pathlib import Path; print(len(list(Path("worksheets").rglob("*.pdf"))))') PDFs)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
