name: Add Year 5 remainder blog internal links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          blog_url = 'blog/how-to-interpret-remainders-division-word-problems-year-5.html'
          title = 'How to Interpret Remainders in Division Word Problems — Year 5'

          # Homepage: add the new guide to Latest from Our Blog.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section class="section" id="latest-blog"'
          start = s.find(marker)
          if start != -1:
              end = s.find('</section>', start)
              section = s[start:end]
              if blog_url not in section:
                  card = '''      <li class="wcard">\n        <div class="thumb c4">Year 5 · Maths</div>\n        <div class="body">\n          <p class="tag">Division · Remainders</p>\n          <h3>How to Interpret Remainders in Division Word Problems</h3>\n          <p class="card-desc">A practical Year 5 guide to deciding whether a remainder should be left, rounded up or ignored in real-world division problems.</p>\n          <a class="btn btn-primary btn-sm" href="blog/how-to-interpret-remainders-division-word-problems-year-5.html">Read the Guide</a>\n        </div>\n      </li>\n'''
                  pos = section.find('<ul class="grid-cards">')
                  if pos != -1:
                      insert_at = start + pos + len('<ul class="grid-cards">')
                      s = s[:insert_at] + '\n' + card + s[insert_at:]
                      p.write_text(s, encoding='utf-8')

          # Blog index: add the article to the Latest Guides collection.
          p = Path('blog/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<h2 id="latest-guides-heading">Latest Guides</h2>'
          start = s.find(marker)
          if start != -1:
              end = s.find('</section>', start)
              section = s[start:end]
              if blog_url not in section:
                  card = '''        <li class="wcard">\n          <div class="thumb c4">Year 5 · Maths</div>\n          <div class="body">\n            <p class="tag">Division · Remainders</p>\n            <h3>How to Interpret Remainders in Division Word Problems — Year 5</h3>\n            <p class="card-desc">Learn how to interpret remainders in real-world Year 5 division problems and decide what the remainder means in each situation.</p>\n            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">\n              <a class="btn btn-primary btn-sm" href="how-to-interpret-remainders-division-word-problems-year-5.html">Read the Guide</a>\n              <a class="btn btn-secondary btn-sm" href="../pages/year-5-maths-division-with-remainders.html">View Worksheet</a>\n            </div>\n          </div>\n        </li>\n'''
                  pos = section.find('<ul class="grid-cards">')
                  if pos != -1:
                      insert_at = start + pos + len('<ul class="grid-cards">')
                      s = s[:insert_at] + '\n' + card + s[insert_at:]
                      p.write_text(s, encoding='utf-8')

          # Year 5 hub: connect the existing Division with Remainders worksheet to the guide.
          p = Path('year-5.html')
          s = p.read_text(encoding='utf-8')
          worksheet_link = '<a class="btn btn-secondary btn-sm" href="pages/year-5-maths-division-with-remainders.html">View Worksheet</a>'
          guide_link = '<a class="btn btn-secondary btn-sm" href="blog/how-to-interpret-remainders-division-word-problems-year-5.html">Read Guide</a>'
          if worksheet_link in s and guide_link not in s:
              s = s.replace(worksheet_link, worksheet_link + '\n            ' + guide_link, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html year-5.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "feat: link Year 5 remainder guide across site"
            git push
          fi
          rm -f .github/workflows/add-remainder-blog-links.yml
          git add -u .github/workflows/add-remainder-blog-links.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary link patch workflow"
          git push
