name: Apply reviewed APA SEO patch

on:
  push:
    branches:
      - seo/technical-cleanup-nov-2026

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'Apply reviewed APA SEO changes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing technical SEO PR branch
        uses: actions/checkout@v4
        with:
          ref: seo/technical-cleanup-nov-2026
          fetch-depth: 0

      - name: Check patch compatibility and apply changes
        run: |
          git apply --check apa-seo-all-changes.patch
          git apply apa-seo-all-changes.patch

      - name: Validate Python, HTML metadata, JSON-LD and sitemap
        run: |
          python -m py_compile scripts/audit-seo.py scripts/generate-worksheet-pages.py
          python scripts/audit-seo.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import xml.etree.ElementTree as ET

          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_jsonld = False
                  self.jsonld = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self.in_jsonld = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_jsonld:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_jsonld:
                      self.jsonld.append(''.join(self.current))
                      self.in_jsonld = False
                      self.current = []

          html_count = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              parser = PageCheck()
              parser.feed(path.read_text(encoding='utf-8', errors='replace'))
              parser.close()
              for block in parser.jsonld:
                  json.loads(block)
              html_count += 1

          sitemap = ET.parse('sitemap.xml').getroot()
          urls = sitemap.findall('.//{*}loc')
          if not urls:
              raise SystemExit('Sitemap validation failed: no URLs')
          print(f'Validated {html_count} HTML files and {len(urls)} current sitemap URLs')
          PY

      - name: Commit validated changes back to the existing PR branch
        run: |
          rm apa-seo-all-changes.patch
          rm .github/workflows/apply-apa-seo-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply reviewed APA SEO changes'
          git push origin HEAD:seo/technical-cleanup-nov-2026